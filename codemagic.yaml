workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreConnect  

    environment:
      node: 20.18.0
      xcode: 16.1
      cocoapods: default
      groups:
        - bib_env  # create this group in Codemagic UI with the vars below

    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up keychain and fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.beforeitbills.app \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files com.beforeitbills.app.ShareExtension \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files com.beforeitbills.app.SubsWidget \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/BeforeItBills.xcworkspace \
            --scheme BeforeItBills

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
