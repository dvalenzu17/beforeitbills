workflows:
  ios-dev-client:
    name: iOS Dev Client → Ad Hoc
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreConnect

    environment:
      node: 20.18.0
      xcode: 26.0.1
      cocoapods: default
      groups:
        - bib_env

    scripts:
      - name: Install JS dependencies
        script: npm ci --legacy-peer-deps

      - name: Patch react-native-svg for RN 0.85
        script: |
          sed -i '' \
            's/observerCoordinator\.removeObserver(\*_imageResponseObserverProxy)/observerCoordinator.removeObserver(_imageResponseObserverProxy)/g' \
            node_modules/react-native-svg/apple/Elements/RNSVGImage.mm
          sed -i '' \
            's/observerCoordinator\.addObserver(\*_imageResponseObserverProxy)/observerCoordinator.addObserver(_imageResponseObserverProxy)/g' \
            node_modules/react-native-svg/apple/Elements/RNSVGImage.mm

      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean

      - name: Patch main xcodeproj for Xcode 26
        script: |
          ruby -e "require 'xcodeproj'; p=Xcodeproj::Project.open('ios/BeforeItBills.xcodeproj'); p.targets.each{|t| t.build_configurations.each{|c| c.build_settings['ENABLE_USER_SCRIPT_SANDBOXING']='NO'}}; p.save"

      - name: Patch Podfile for Xcode 26
        script: |
          perl -i -0pe 's/post_install do \|installer\|/post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"\n    end\n  end/g' ios/Podfile

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up keychain and fetch signing files
        script: |
          set -e
          keychain initialize
          for BUNDLE_ID in \
            com.beforeitbills.app \
            com.beforeitbills.app.ShareExtension \
            com.beforeitbills.app.SubsWidget; do
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_ADHOC \
              --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
              --create \
              --delete-stale-profiles \
              --log-api-calls
          done
          keychain add-certificates
          cd ios && xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/BeforeItBills.xcworkspace \
            --scheme BeforeItBills || {
            echo "=== XCODE BUILD ERRORS ==="
            find /tmp/xcodebuild_logs -name "*.log" 2>/dev/null | xargs grep -h " error:" 2>/dev/null | grep -v "^#" | head -80
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreConnect

    environment:
      node: 20.20
      xcode: 26.0.1
      cocoapods: default
      groups:
        - bib_env

    scripts:
      - name: Install JS dependencies
        script: npm ci --legacy-peer-deps

      - name: Patch react-native-svg for RN 0.85
        script: |
          sed -i '' \
            's/observerCoordinator\.removeObserver(\*_imageResponseObserverProxy)/observerCoordinator.removeObserver(_imageResponseObserverProxy)/g' \
            node_modules/react-native-svg/apple/Elements/RNSVGImage.mm
          sed -i '' \
            's/observerCoordinator\.addObserver(\*_imageResponseObserverProxy)/observerCoordinator.addObserver(_imageResponseObserverProxy)/g' \
            node_modules/react-native-svg/apple/Elements/RNSVGImage.mm

      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean

      - name: Patch main xcodeproj for Xcode 26
        script: |
          ruby -e "require 'xcodeproj'; p=Xcodeproj::Project.open('ios/BeforeItBills.xcodeproj'); p.targets.each{|t| t.build_configurations.each{|c| c.build_settings['ENABLE_USER_SCRIPT_SANDBOXING']='NO'}}; p.save"

      - name: Patch Podfile for Xcode 26
        script: |
          perl -i -0pe 's/post_install do \|installer\|/post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"\n    end\n  end/g' ios/Podfile

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up keychain and fetch signing files
        script: |
          set -e
          keychain initialize
          for BUNDLE_ID in \
            com.beforeitbills.app \
            com.beforeitbills.app.ShareExtension \
            com.beforeitbills.app.SubsWidget; do
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
              --create \
              --delete-stale-profiles \
              --log-api-calls
          done
          keychain add-certificates
          cd ios && xcode-project use-profiles

      - name: Debug signing state
        script: |
          echo "=== Find ALL provisioning profiles on disk ==="
          find /Users/builder /tmp -name "*.mobileprovision" 2>/dev/null || echo "none found anywhere"
          echo "=== Find ALL p12 certificates on disk ==="
          find /Users/builder /tmp -name "*.p12" 2>/dev/null || echo "none found"
          echo "=== Xcode build settings (provisioning) ==="
          xcodebuild -workspace ios/BeforeItBills.xcworkspace -scheme BeforeItBills -showBuildSettings 2>/dev/null \
            | grep -E "PROVISIONING_PROFILE|CODE_SIGN|BUNDLE_IDENTIFIER" | head -60

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/BeforeItBills.xcworkspace \
            --scheme BeforeItBills || {
            echo "=== XCODE BUILD ERRORS ==="
            find /tmp/xcodebuild_logs -name "*.log" 2>/dev/null | xargs grep -h " error:" 2>/dev/null | grep -v "^#" | head -80
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
