# TEST: Onboarding skip flow — tapping Skip on every slide lands on home
# NOTE: Only runs onboarding steps if onboarding is actually shown.
#       With an existing test account, user_metadata.onboarding_done persists,
#       so onboarding is skipped by the app and this flow passes immediately.
appId: com.beforeitbills.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow: utils/signin.yaml
- waitForAnimationToEnd
- takeScreenshot: "05_onboarding_start"

# Only run onboarding steps if the first slide is actually visible
- runFlow:
    when:
      visible: "subscriptions"
    commands:
      - assertVisible: "12"
      - tapOn: "Next"
      - waitForAnimationToEnd
      - takeScreenshot: "05_onboarding_slide2"

      # Slide 2 — Problem
      - assertVisible: "Sound familiar?"
      - tapOn: "Skip"
      - waitForAnimationToEnd

      # Slide 3 — Personalize
      - assertVisible: "What hits closest to home?"
      - tapOn: "Skip"
      - waitForAnimationToEnd

      # Slide 4 — Solution
      - tapOn: "Skip"
      - waitForAnimationToEnd

      # Slide 5 — Outcomes
      - assertVisible: "Not features. Results."
      - tapOn: "Skip"
      - waitForAnimationToEnd

      # Slide 6 — Magic / Live preview
      - assertVisible: "Here's what it looks like"
      - tapOn: "Skip"
      - waitForAnimationToEnd

      # Slide 7 — Quick win
      - assertVisible: "Add one you recognize"
      - tapOn: "Skip"
      - waitForAnimationToEnd

      # Slide 8 — CTA
      - assertVisible: "Start free 7-day trial"
      - assertVisible: "Not now"
      - tapOn: "Not now"
      - waitForAnimationToEnd

- takeScreenshot: "05_onboarding_complete"

# Should be on home screen
- extendedWaitUntil:
    visible: "Add recurring expense"
    timeout: 10000
