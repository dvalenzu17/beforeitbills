# TEST: Forgot password flow sends reset email
appId: com.beforeitbills.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd

- assertVisible: "Welcome back"
- tapOn:
    id: "auth-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard

- tapOn: "Forgot password?"
- waitForAnimationToEnd
- takeScreenshot: "03_forgot_password_sent"

# Should show confirmation alert
- assertVisible: "Reset sent"
- assertVisible: "Check your inbox."
- tapOn: "OK"

# Tapping forgot password with no email filled should prompt
- tapOn:
    id: "auth-email-input"
# Clear the email
- clearText
- hideKeyboard
- tapOn: "Forgot password?"
- assertVisible: "Enter your email first"
- tapOn: "OK"
