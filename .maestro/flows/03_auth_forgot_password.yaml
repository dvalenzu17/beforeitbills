# TEST: Forgot password — reset email sent; tapping with no email shows prompt
appId: com.beforeitbills.app
---
- runFlow: utils/ensure_signed_out.yaml

- tapOn:
    id: "auth-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard

- tapOn: "Forgot password?"
- waitForAnimationToEnd
- takeScreenshot: "03_reset_sent"

- assertVisible: "Reset sent"
- assertVisible: "Check your inbox."
- tapOn: "OK"

# Now clear the email and try again — should prompt to enter email first
- tapOn:
    id: "auth-email-input"
- eraseText: 100
- hideKeyboard
- tapOn: "Forgot password?"
- waitForAnimationToEnd
- assertVisible: "Enter your email first"
- tapOn: "OK"
