# TEST: Manually add a subscription — appears in list, can be edited, can be deleted
appId: com.beforeitbills.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow: utils/signin.yaml
- runFlow: utils/skip_onboarding.yaml
- waitForAnimationToEnd

# Open add form
- tapOn: "Add recurring expense"
- waitForAnimationToEnd
- takeScreenshot: "08_add_form_open"

# Fill in merchant name
- tapOn:
    text: "Name"
    optional: true
- inputText: "Maestro Test Sub"
- hideKeyboard

# Fill in amount
- tapOn:
    text: "Amount"
    optional: true
- inputText: "9.99"
- hideKeyboard

# Save / confirm
- tapOn:
    text: "Save"
    optional: true
- tapOn:
    text: "Add"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: "08_add_saved"

# Back to home — item should appear
- back
- waitForAnimationToEnd

# Verify subscription shows in the list (scroll to find it)
- scrollUntilVisible:
    element:
      text: "Maestro Test Sub"
    direction: DOWN
    timeout: 5000
- assertVisible: "Maestro Test Sub"
- takeScreenshot: "08_add_visible_in_list"
