# TEST: Subscription detail — tap item, verify detail screen, change status, go back
# Requires at least one subscription to exist (run 08_add_subscription first, or use real data)
appId: com.beforeitbills.app
---
- launchApp
- waitForAnimationToEnd
- runFlow: utils/signin.yaml
- runFlow: utils/skip_onboarding.yaml
- waitForAnimationToEnd

# Tap first subscription in Upcoming section
- scrollUntilVisible:
    element:
      text: "Subscriptions"
    direction: DOWN
- tapOn: "Subscriptions"
- waitForAnimationToEnd

# Tap the first list item (any subscription)
- tapOn:
    index: 0
    text: ".*"
    regex: true
    optional: true
- waitForAnimationToEnd
- takeScreenshot: "09_sub_detail_open"

# Detail screen should show renewal date (not a raw ISO string)
- assertNotVisible: "T00:00:00"
- assertNotVisible: "T00:00:00.000Z"

# Verify brand logo / name area and back navigation works
- back
- waitForAnimationToEnd
- assertVisible: "Home"
