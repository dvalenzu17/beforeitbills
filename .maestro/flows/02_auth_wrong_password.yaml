# TEST: Wrong password shows sanitized error (not raw Supabase message)
appId: com.beforeitbills.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd

- assertVisible: "Welcome back"
- tapOn:
    id: "auth-email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "auth-password-input"
- inputText: "wrong-password-12345"
- hideKeyboard
- tapOn:
    id: "auth-submit-btn"
- waitForAnimationToEnd
- takeScreenshot: "02_auth_wrong_password_error"

# Should show our sanitized error alert, not a raw Supabase message
- assertVisible: "Sign in failed"
- assertVisible: "Check your email and password and try again."
# Must NOT show raw backend error text
- assertNotVisible: "Invalid login credentials"
- assertNotVisible: "PostgreSQL"

# Dismiss alert
- tapOn: "OK"
